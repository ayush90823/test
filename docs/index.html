<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd;
               font-family: system-ui, sans-serif; }
  video { width: 100%; height: 100%; outline: none; background: #000; display: none; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center;
         justify-content: center; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div id="msg">Loading...</div>
<video id="v" controls playsinline preload="metadata"></video>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get("id");
  var hash = params.get("hash");
  var msg = document.getElementById("msg");
  var video = document.getElementById("v");

  if (!/^\d+$/.test(id || "") || !/^[0-9a-f]{16}$/.test(hash || "")) {
    msg.textContent = "Invalid link.";
    return;
  }

  // Ye page https://<owner>.github.io/<repo>/ par host hota hai, isliye
  // owner aur repo URL se hi mil jate hain (kuch configure nahi karna).
  var owner = location.hostname.split(".")[0];
  var repo = location.pathname.split("/")[1];
  var urlFile = "https://raw.githubusercontent.com/" + owner + "/" + repo + "/tunnel/url.json";

  var tries = 0;

  function load() {
    fetch(urlFile + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("url.json " + r.status);
        return r.json();
      })
      .then(function (d) {
        var base = String(d.url || "").replace(/\/+$/, "");
        if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(base)) {
          throw new Error("bad url");
        }
        video.src = base + "/stream/" + id + "?hash=" + hash;
        video.style.display = "block";
        msg.style.display = "none";
      })
      .catch(retry);
  }

  function retry() {
    tries++;
    msg.style.display = "flex";
    msg.textContent = "Server abhi start ho raha hai, thodi der me dobara try ho raha hai...";
    setTimeout(load, 10000);
  }

  // Agar tunnel restart ho gaya ho to purana URL fail hoga; naya URL le kar dobara try karo.
  video.addEventListener("error", function () {
    video.style.display = "none";
    retry();
  });

  load();
})();
</script>
</body>
</html>
